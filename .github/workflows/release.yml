name: Release

# Releases are built on the server with `make release` and uploaded with
# `gh release create`. This workflow only runs when started by hand
# (Actions → Release → Run workflow) for a tag that already exists.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.5.0)"
        required: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, output: shipyard-linux-amd64 }
          - { goos: linux, goarch: arm64, output: shipyard-linux-arm64 }
          - { goos: linux, goarch: arm, goarm: "7", output: shipyard-linux-armv7 }
          - { goos: darwin, goarch: arm64, output: shipyard-darwin-arm64 }
          - { goos: darwin, goarch: amd64, output: shipyard-darwin-amd64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
        run: |
          test -f web/dist/index.html || { echo "web UI missing from web/dist"; exit 1; }
          go build -ldflags "-s -w -X shipyard/internal/version.Version=${{ inputs.tag }}" -o ${{ matrix.output }}
          grep -q 'id="root"' ${{ matrix.output }} || { echo "web UI not embedded in ${{ matrix.output }}"; exit 1; }
          sha256sum ${{ matrix.output }} > ${{ matrix.output }}.sha256

      - name: Upload Release Binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            ${{ matrix.output }}
            ${{ matrix.output }}.sha256
