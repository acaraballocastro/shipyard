name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: shipyard-linux-amd64

          - goos: linux
            goarch: arm64
            output: shipyard-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        run: cd web && npm ci --no-audit --no-fund && npm run build

      - name: Build binary
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags "-s -w -X shipyard/internal/version.Version=${{ github.ref_name }}" -o ${{ matrix.output }}

      - name: Upload Release Binary
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.output }}