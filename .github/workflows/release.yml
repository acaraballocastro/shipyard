name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: shipyard-linux-amd64

          - goos: linux
            goarch: arm64
            output: shipyard-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Build binary
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -o ${{ matrix.output }}

      - name: Upload Release Binary
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.output }}